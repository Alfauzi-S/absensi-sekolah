# Absensi Sekolah (Laravel) - stack Docker.
#
#   web       : Nginx, satu-satunya service yang membuka port ke host (APP_PORT, bawaan 8090)
#   app       : PHP-FPM + kode Laravel (docker/php/Dockerfile). Saat start: migrasi, pindah data versi lama (sekali), cache.
#   scheduler : image yang sama, menjalankan "php artisan schedule:work" (tiap 5 menit memberi Alpa setelah jam pulang)
#   db        : MariaDB, data di volume bernama yang sama dengan versi lama (absensi_sekolah_db)
#
# Pasang / perbarui : git pull && docker compose up -d --build
# Pertama kali      : buka http://<host>:8090 lalu buat akun admin (bila belum ada data versi lama)

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Absensi Sekolah}
  APP_ENV: production
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_BASE_URL:-http://localhost}
  APP_LOCALE: id
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  SESSION_DRIVER: file
  SESSION_LIFETIME: "720"
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_NAME:-absensi_sekolah}
  DB_USERNAME: ${DB_USER:-absensi}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi. Salin .env.example menjadi .env.}
  # Tabel versi Laravel memakai awalan abs_ agar bisa berdampingan dengan tabel versi lama.
  DB_PREFIX: abs_

services:
  web:
    image: nginx:alpine
    container_name: absensi_web
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8090}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: absensi-sekolah-laravel
    container_name: absensi_app
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  scheduler:
    image: absensi-sekolah-laravel
    container_name: absensi_scheduler
    restart: unless-stopped
    user: root
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    environment:
      <<: *app-env
      RUN_SETUP: "false"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    logging: *logging

  db:
    image: mariadb:13.0
    container_name: absensi_db
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      MARIADB_DATABASE: ${DB_NAME:-absensi_sekolah}
      MARIADB_USER: ${DB_USER:-absensi}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi. Salin .env.example menjadi .env.}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi. Salin .env.example menjadi .env.}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

volumes:
  db_data:
    name: absensi_sekolah_db
  storage:
    name: absensi_sekolah_storage
