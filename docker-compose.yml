# Absensi Sekolah - stack Docker.
#
#   web : Nginx (image nginx:alpine terbaru) -> satu-satunya service yang mengekspos port ke host
#   app : PHP 8.5 FPM (docker/php/Dockerfile) -> aplikasi
#   db  : MariaDB 13.0 (GA terbaru), data tersimpan di volume bernama
#   scheduler : image yang sama dengan app, menjalankan bin/scheduler.php (tiap 5 menit: tutup sesi,
#               kirim WhatsApp, cadangan harian ke storage/backups). Pengganti cron.
#
# Port default 8090 (ubah APP_PORT di .env bila sudah dipakai).
#
# Jalankan : docker compose up -d --build
# Instalasi: http://<host>:8090/install

services:
  web:
    image: nginx:alpine
    container_name: absensi_web
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: absensi-sekolah-app
    container_name: absensi_app
    restart: unless-stopped
    volumes:
      # Kode di-bind mount supaya perubahan langsung terpakai tanpa rebuild.
      - ./:/var/www/html
    environment:
      # Aplikasi (dipakai docker/php/generate-config.php untuk membuat config/config.php)
      APP_NAME: ${APP_NAME:-Absensi Sekolah}
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_LOCALE: ${APP_LOCALE:-id}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      APP_TIMEZONE_LABEL: ${APP_TIMEZONE_LABEL:-WITA}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_PRETTY_URLS: ${APP_PRETTY_URLS:-true}
      APP_CONFIG_SYNC: ${APP_CONFIG_SYNC:-true}
      # Database (nama service "db" sebagai host; port tidak dipublikasikan ke host)
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-absensi_sekolah}
      DB_USER: ${DB_USER:-absensi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi. Salin .env.example menjadi .env.}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: absensi-sekolah-app
    container_name: absensi_scheduler
    restart: unless-stopped
    # Berjalan sebagai www-data agar file cadangan bisa diunduh dari halaman Kesehatan Sistem.
    user: "www-data"
    command: ["php", "bin/scheduler.php"]
    volumes:
      - ./:/var/www/html
    environment:
      # config/config.php dibuat oleh container app; scheduler cukup memakainya.
      APP_CONFIG_SYNC: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:13.0
    container_name: absensi_db
    restart: unless-stopped
    # Beri waktu MariaDB menutup dengan rapi saat container dihentikan.
    stop_grace_period: 1m
    environment:
      MARIADB_DATABASE: ${DB_NAME:-absensi_sekolah}
      MARIADB_USER: ${DB_USER:-absensi}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi. Salin .env.example menjadi .env.}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi. Salin .env.example menjadi .env.}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Upgrade besar (mis. 12.3 -> 13.0) dijalankan otomatis saat start pertama.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
    name: absensi_sekolah_db
