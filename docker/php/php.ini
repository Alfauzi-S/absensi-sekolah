; Konfigurasi PHP untuk Absensi Sekolah (menimpa php.ini-production).
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 120
expose_php = Off

; Kode ada di dalam image (tidak di-bind mount), jadi OPcache tidak perlu memeriksa perubahan file.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
