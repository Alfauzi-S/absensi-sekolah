name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tes (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, zip
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/php/Dockerfile -t absensi-sekolah-laravel .
      - name: Jalankan stack dan cek halaman login
        run: |
          printf 'DB_PASSWORD=ci-rahasia\nDB_ROOT_PASSWORD=ci-root\n' > .env
          docker compose up -d
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/setup || true)
            [ "$code" = "200" ] && echo "OK: /setup 200" && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1
